# Execution-bench isolation: two containers on an internal network.
#
#   services  the grader + LLM gateway + fake upstreams. Holds secret tests.
#             Connected to both `bench_internal` and `default` (bridge).
#             Mounts required host dependency repos read-only for grading.
#   bench     the ephemeral agent workspace. Sees /work only.
#             Connected strictly to `bench_internal` (internal: true, no internet egress).
#
name: bugbench-exec

services:
  services:
    build:
      context: ./docker/services
    image: bugbench-services:latest
    container_name: bugbench-services
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8888:8888"
    volumes:
      - /home/ras/.local/bin:/srv/repos/bin:ro
      - /home/ras/pr-ai/quality:/srv/repos/quality:ro
      - /home/ras/marketplace-monitor:/srv/repos/marketplace-monitor:ro
      - /home/ras/llm-bugbench:/srv/repos/llm-bugbench:ro
      - ./docker/services/server.py:/srv/server.py:ro
      - ./data:/srv/data:ro
    environment:
      - LITELLM_BASE=https://aitshirts.in/litellm/v1
      - LITELLM_KEY=sk-litellm-vps-2026
    networks:
      - bench_internal
      - default
    restart: unless-stopped

networks:
  bench_internal:
    internal: true
