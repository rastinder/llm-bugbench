[project]
name = "llm-bugbench"
version = "1.0.0"
description = "Benchmark that measures how well LLMs identify and fix real bugs"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx"]

[project.scripts]
bugbench = "bugbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
